services:
  - type: web
    name: debloat-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: rzp_test_xxx
      - key: RAZORPAY_KEY_SECRET
        value: xxx
      - key: FRONTEND_ORIGIN
        sync: false
